<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <link rel='stylesheet' type='text/css' media='screen' href='style.css'>
    <title>Document</title>
</head>
<body>
    <div class="main">
        <div class="sidebar">
            <div class="hireme">
                <b>HireMe Now!</b>
            </div>
            <div class="sidelist">
                <ul type="none">
                    <li>
                        <img src="images/dashboard 1.png" alt="dashboard">
                        <span>Dash Board</span>
                    </li><br>
                    <li>
                        <img src="images/suitcase 2.png" alt="Jobs">
                        <span>Jobs</span>
                    </li><br>
                    <li>
                        <img src="images/application (1) 1.png" alt="Applications">
                        <span>Applications</span>
                    </li><br>
                    <li>
                        <img src="images/question (1) 1.png" alt="Interviews">
                        <span>Interviews</span>
                    </li><br>
                    <li>
                        <img src="images/message 1.png" alt="Messages">
                        <span>Messages</span>
                    </li><br>
                    <li>
                        <img src="images/settings 1.png" alt="dashboard">
                        <span>Settings</span>
                    </li><br>
                </ul>
                <img class="add" src="images/add-group (1) 1.png">
            </div>
        </div>
        <div class="second">
            <div class="navbar">
                <img src="images/notification-bing.png" alt="notification" width="30px height=30px">
                <img src="images/cheerful.png" alt="profile pic" width="40px height=40px">
                <span style="color: blue;">Olivia</span>
            </div>
            <hr style="color: rgb(68, 70, 70);">
            <div class="content">
                <hr style="color: rgb(68, 70, 70);"><br><br>
                <form class="form">
                    <ul type="none">
                        <li>
                            <label>Job Title</label><br>
                            <input class="input2" type="text"  placeholder="Enter Job Title">
                        </li>
                        <li>
                            <label>Description</label><br>
                            <input class="input2" type="text"  placeholder="Enter Description">
                        </li>
                        <li>
                            <label>Salary</label><br>
                            <input class="input2" type="number"  placeholder="Enter Salary">
                        </li>
                        <li>
                            <label>Location</label><br>
                            <input class="input2" type="text"  placeholder="Enter Location">
                        </li>
                    </ul>
                    <div class="bottom">
                        <button>Send</button>
                        <div>
                            <label >push Notification</label>
                            <input class="input1" type="checkbox" >
                        </div>
                        <div>
                            <label >Email Notification</label>
                            <input type="checkbox" >
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="footer">
        <span>Get Your Dream Job......</span>
        <div class="img1"></div>
        <div class="img2"></div>
    </div>
</body>
</html>
